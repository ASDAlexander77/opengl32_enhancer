name: Build

on:
  push:
    branches: [master]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to publish as a GitHub Release (e.g. v1.0.0). Leave empty to just build.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure (x86)
        run: cmake -S . -B build -A Win32

      # No --target, so this builds the test executables as well as the DLL. Compiling them is
      # worth it on its own: it type-checks every test against the current headers, which is
      # what catches a signature change that was applied to the DLL sources but not to a test.
      - name: Build
        run: cmake --build build --config Release

      # GitHub's windows runners have no GPU - OpenGL falls back to Microsoft's GDI Generic
      # 1.1 implementation, which has no compute shaders at all - so the tests labeled "gpu"
      # cannot pass here and are excluded. They are not skippable in a meaningful sense: a
      # missing GL 4.3 is precisely the failure they exist to catch on real hardware, so
      # teaching them to pass without a GPU would make them worthless. Run them locally
      # (`ctest -L gpu`) before releasing anything that touches a shader.
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error -LE gpu

      # config_editor.exe ships flat, alongside the DLL, rather than in a tools/ subfolder.
      # With no argv it opens "opengl32_enhancer.ini" relative to its working directory, which
      # when double-clicked is its own folder - so sitting next to the DLL in the game's
      # directory means it edits THE GAME'S ini with no setup, which is the whole workflow the
      # frame dump feature is built around. From a subfolder it would find no ini at all and
      # silently come up showing effect=none.
      #
      # Note the path shape: unlike the DLL's build/Release/, this target sets its own
      # RUNTIME_OUTPUT_DIRECTORY (see CMakeLists.txt), and the Visual Studio generator used
      # here appends the per-config subdirectory to it - hence config_editor_dir/Release/.
      # Local Ninja builds have no such subdirectory. Copy-Item hard-fails on a missing
      # source, so if that ever changes this step breaks loudly instead of quietly publishing
      # an archive with the editor missing.
      - name: Stage archive contents
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path stage -Force | Out-Null
          Copy-Item build/Release/opengl32_enh32.dll stage/opengl32.dll
          Copy-Item build/config_editor_dir/Release/config_editor.exe stage/config_editor.exe
          Copy-Item opengl32_enhancer.ini stage/opengl32_enhancer.ini
          Copy-Item cyberpunk.cube stage/cyberpunk.cube

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: opengl32_enhancer
          path: stage/*

      - name: Zip release archive
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: pwsh
        run: Compress-Archive -Path stage/* -DestinationPath opengl32_enhancer.zip

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.release_tag }}" opengl32_enhancer.zip --title "${{ inputs.release_tag }}" --generate-notes
