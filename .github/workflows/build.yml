name: Build

on:
  push:
    branches: [master]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to publish as a GitHub Release (e.g. v1.0.0). Leave empty to just build.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure (x86)
        run: cmake -S . -B build -A Win32

      - name: Build
        run: cmake --build build --config Release --target opengl32_enh32

      - name: Stage archive contents
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path stage -Force | Out-Null
          Copy-Item build/Release/opengl32_enh32.dll stage/opengl32.dll
          Copy-Item opengl32_enhancer.ini stage/opengl32_enhancer.ini
          Copy-Item cyberpunk.cube stage/cyberpunk.cube

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: opengl32_enhancer
          path: stage/*

      - name: Zip release archive
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: pwsh
        run: Compress-Archive -Path stage/* -DestinationPath opengl32_enhancer.zip

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.release_tag }}" opengl32_enhancer.zip --title "${{ inputs.release_tag }}" --generate-notes
