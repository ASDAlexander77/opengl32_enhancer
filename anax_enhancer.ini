; Pipeline order (fixed): effect (capture) -> AcesToneMap -> LutGrading -> Sharpen -> Taa -> Output.
; Every stage after `effect` is an independent addon - each can be turned on/off regardless
; of what else is enabled.

; effect: which primary/base effect to apply (upscale or misc). One of:
;effect=none
;effect=invert
;effect=bilinear
effect=nvscaler

; scale: 0.5..1, used by nvscaler/bilinear
scale=0.8

; enableAcesToneMap / acesStrength: ACES filmic tone-mapping curve. acesStrength is 0..1:
; 0=unchanged, 1=full curve.
enableAcesToneMap=true
acesStrength=0.3

; enableLutGrading / lutPath / lutStrength: 3D-LUT color grading from an Adobe/Iridas ".cube"
; file (path resolved next to this DLL, same as this ini file). lutStrength is 0..1: 0=LUT has
; no effect, 1=full LUT. Left commented out by default since no LUT ships with this proxy.
;enableLutGrading=true
;lutPath=my_look.cube
lutStrength=1.0

; enableSharpen / sharpness: NVIDIA Image Scaling's adaptive directional sharpen (CAS-style).
; sharpness is 0..1.
enableSharpen=true
sharpness=0.75

; enableTaa / taaBlend: motion-vector-free temporal blend with neighborhood clamping. taaBlend
; is 0..1, the history blend amount: 0=no temporal blend, 1=heaviest.
enableTaa=true
taaBlend=0.85
