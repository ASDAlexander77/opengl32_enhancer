; effect: which primary post-process effect to apply. One of:
;effect=none
;effect=invert
;effect=bilinear
;effect=nvsharpen
effect=nvscaler

; sharpness: 0..1, used by nvscaler/nvsharpen
sharpness=0.75

; scale: 0.5..1, used by nvscaler/bilinear
scale=0.8

; enableTaa / taaBlend: optional addon pass layered after the primary effect above (works
; even with effect=none). taaBlend is 0..1, the history blend amount: 0=no temporal blend,
; 1=heaviest.
enableTaa=true
taaBlend=0.85

; enableHdrLook / hdrStrength: optional addon pass layered after the primary effect, before
; TAA (works even with effect=none). hdrStrength is 0..1: 0=unchanged, 1=full filmic grading
; curve.
enableHdrLook=true
hdrStrength=0.3
