; effect: the post-process pipeline, as a comma-separated list of stages.
;
;   - A stage runs if and only if it is listed here. Leave it out to turn it off.
;   - Stages run in the order they are listed, left to right, so reordering this line
;     reorders the pipeline. `effect=bloom, acestonemap` and `effect=acestonemap, bloom`
;     are both valid and produce different images.
;   - Names are case-insensitive, and surrounding spaces are ignored.
;   - `effect=none` (or an empty list) disables post-processing entirely.
;
; Available stages:
;   invert              debug/demo - inverts the image
;   bilinear            bilinear resample (see `scale`)
;   nvscaler            NVIDIA Image Scaling upscaler (see `scale`, `sharpness`)
;   bloom               glow on bright highlights (see `bloomThreshold`, `bloomIntensity`)
;   acestonemap         ACES filmic tone-mapping curve (see `acesStrength`)
;   lutgrading          3D-LUT color grading from a .cube file (see `lutPath`, `lutStrength`)
;   vignette            darkens the corners (see `vignetteIntensity`, `vignetteRadius`)
;   chromaticaberration lens-style edge fringing (see `chromaticAberrationStrength`)
;   taa                 temporal anti-aliasing (see `taaBlend`)
;   smaa                spatial anti-aliasing (SMAA) - no ghosting, but no reprojection either;
;                        see the project README for how it compares to `taa`
;   fsr                 AMD FidelityFX Super Resolution 1 - EASU edge-adaptive reconstruction
;                        plus RCAS sharpening (see `scale`, `sharpness`, `fsrDenoise`,
;                        `fsrFilmGrain`)
;   cas                 AMD FidelityFX Contrast Adaptive Sharpening - the lightest of the three
;                        sharpeners here, sharpen-only, never resizes (see `sharpness`)
;   sharpen             NVIDIA Image Scaling adaptive sharpen (see `sharpness`)
;   nr                  edge-aware (bilateral) noise reduction - smooths sampling/shader noise
;                        without a blanket blur (see `nrIntensity`, `nrPasses`,
;                        `nrColorStrength`, `nrTonePreservation`, `nrGrainPreservation`)
;   localcontrast       local tone/structure boost ("clarity"/"texture") at two blur radii (see
;                        `localStructureStrength`, `localToneStrength`)
;   dither              ordered dither, masks 8-bit banding (see `ditherStrength`)
;   ssao                screen-space ambient occlusion - darkens creases, corners and contact
;                        points using the game's own depth buffer (see `ssaoRadius`,
;                        `ssaoIntensity`, `ssaoBias`). id Tech 2-era renderers bake their lighting
;                        and have no occlusion term at all, so this is what makes objects look
;                        seated in the world instead of pasted onto it. Needs the game's depth
;                        buffer AND its projection (read from the game's own glFrustum call);
;                        no-ops rather than guessing if either is missing.
;   depthvignette       EXPERIMENTAL/SPIKE - darkens by scene depth (background fades, foreground
;                        stays lit) instead of screen-space corner distance like `vignette` (see
;                        `depthVignetteIntensity`, `depthVignetteThreshold`). Needs the game's own
;                        depth buffer to still be present at swap time; falls back to a no-op if not.
;
; Ordering notes, if you're unsure where to put something: tone mapping and grading want to
; run before the "lens" stages (vignette, chromatic aberration) so the LUT grades real scene
; colors rather than colors the lens simulation already darkened. If using `smaa` or `taa`,
; put it before `sharpen` - sharpening after antialiasing recovers detail smoothing softened,
; sharpening before it would just resharpen edges antialiasing then re-smooths. Don't list
; both `smaa` and `taa` together - they solve the same problem, and stacking them is wasted
; work, not better antialiasing. `fsr` reconstructs and sharpens, so it belongs early - before
; the "lens" stages - and listing it together with `sharpen` or `cas` double-sharpens. `nr`
; belongs BEFORE any sharpener (sharpening first would just resharpen the noise `nr` is about to
; remove) and before `localcontrast` too (boosting local contrast in still-noisy source makes
; the noise more visible, not less). Dither is best left last, so it dithers the finished image
; right before it hits the 8-bit back buffer.
;effect=bilinear, bloom, acestonemap, lutgrading, vignette, chromaticaberration, smaa, sharpen, dither
;effect=bilinear, bloom, acestonemap, lutgrading, vignette, chromaticaberration, taa, sharpen, dither
;effect=nr, bilinear, fsr, localcontrast, bloom, acestonemap, lutgrading, vignette, chromaticaberration, taa, dither
effect=bilinear, fsr, bloom, acestonemap, lutgrading, vignette, chromaticaberration, taa, dither

; --- Per-stage parameters. Only read by the stage they belong to, so a parameter for a stage
; --- you haven't listed is simply ignored.

; scale: 0.5..1, used by `bilinear`, `nvscaler` and `fsr`. It is the fraction of the current
; resolution the source is treated as having been rendered at, before the stage reconstructs
; full size - so it trades detail for the look of a lower-resolution render, and the three
; stages are directly comparable at the same value. 1.0 means no resampling at all: bilinear is
; then an exact copy, and fsr shows only its RCAS sharpening. (`sharpen` is sharpen-only and
; always runs 1:1, so it ignores this.)
scale=1.0

; bloomThreshold is 0..1 (luma level where the glow starts, soft-kneed). bloomIntensity is
; 0..2: 0=no glow added, higher values add a stronger glow.
bloomThreshold=0.8
bloomIntensity=0.5

; acesStrength is 0..1: 0=unchanged, 1=full curve.
acesStrength=0.8

; lutPath is resolved next to this DLL, same as this ini file. lutStrength is 0..1: 0=LUT has
; no effect, 1=full LUT. cyberpunk.cube: teal-tinted shadows, magenta/pink-tinted highlights,
; boosted contrast and saturation - a neon-noir look.
lutPath=cyberpunk.cube
lutStrength=0.3

; vignetteIntensity is 0..1 (0=off, 1=corners fade to black). vignetteRadius is 0..1: where
; the falloff starts as a fraction of the center-to-corner distance - everything closer to the
; center than this is left untouched, so a high radius means a tight corners-only vignette.
vignetteIntensity=0.25
vignetteRadius=0.7

; ssaoRadius is in the GAME'S OWN WORLD UNITS, not a 0..1 fraction like nearly everything else
; here - Quake II units are roughly an inch, so useful values are tens of units, and this is the
; one SSAO setting that genuinely needs tuning per game. Too small and occlusion hugs the
; geometry invisibly; too large and every surface shades every other one into mush.
; ssaoIntensity is 0..1: how dark fully-occluded pixels get (0 = exact no-op).
; ssaoBias is a small view-space epsilon (0..16) that stops a flat surface occluding itself
; through depth-precision noise - raise it if flat walls look dirty/banded, lower it if contact
; shadows have gone missing. Put `ssao` EARLY in the effect= list, before tone mapping and
; grading: it is a lighting term, so it should be applied to scene colors and then graded, not
; painted over a finished grade.
ssaoRadius=24.0
ssaoIntensity=0.5
ssaoBias=0.5

; EXPERIMENTAL/SPIKE - depthVignetteIntensity is 0..1 (0=off, 1=most distant pixels fade to
; black), used by `depthvignette`. depthVignetteThreshold is 0..1: the raw (non-linear) scene
; depth below which a pixel is left untouched - everything nearer stays exactly as rendered, and
; the falloff ramps smoothly from there out to the far plane. Try this instead of `vignette` to
; compare a depth-based fade against the usual screen-corner one.
depthVignetteIntensity=0.5
depthVignetteThreshold=0.3

; chromaticAberrationStrength is 0..1; ~0.2-0.4 reads as a subtle lens artifact, 1.0 is
; deliberately overdone.
chromaticAberrationStrength=0.3

; taaBlend is 0..1, the history blend amount: 0=no temporal blend, 1=heaviest. This is a
; ceiling, not a fixed weight: `taa` automatically cuts a pixel's effective blend the larger its
; raw (pre-clamp) difference from history is, so a pixel whose content just changed (a fast
; scene change, a hard cut) converges to the new frame in about one call rather than fading in
; over several - taaBlend only governs pixels that are genuinely still showing the same thing.
taaBlend=0.85

; shimmerSuppression is 0..1 (0=off), used by `taa`. taaBlend alone still leaves a fixed floor
; of quiet frame-to-frame flicker (dithered/noisy specular highlights, foliage, fine detail near
; the shading noise floor). This raises the EFFECTIVE blend weight specifically where the
; current frame and history already nearly agree - i.e. nothing is actually moving there - so it
; can't add extra ghosting to real motion or edges the way raising taaBlend itself would.
shimmerSuppression=0.0

; sharpness is 0..1, used by sharpen/nvscaler/fsr/cas. For `fsr` it sets RCAS's attenuation
; and for `cas` the peak term, 1 being sharpest in both.
sharpness=0.75

; fsrDenoise (0/1, default 0) enables FSR's optional noise-detection path: RCAS sharpens less
; where a pixel looks like isolated noise rather than a real edge. Worth turning on for grainy
; or dithered source material, at the cost of a little sharpness on genuinely detailed input.
fsrDenoise=1

; fsrFilmGrain is 0..1 (0=off): re-applies film grain AFTER reconstruction, weighted so it
; fades out in blacks and highlights. FSR's own guidance is that grain added before upscaling
; gets resampled into mush, so this is where to add it if you want that look.
fsrFilmGrain=0.05

; ditherStrength is 0..1: 0=unchanged, 1=full +-0.5-LSB dither offset.
ditherStrength=0.7

; nrIntensity is 0..1, used by `nr`: how large a luma difference the bilateral filter still
; treats as "the same surface" (its range sigma). 0 makes every pass an effective no-op; 1 is
; the most aggressive. nrPasses is 1..4: how many times the filter runs in sequence - more
; passes compounds the smoothing independently of nrIntensity (which controls each individual
; pass's strength).
nrIntensity=0.5
nrPasses=1

; nrColorStrength is 0..1, used by `nr`: a multiplier on how much of the filtered CHROMA
; (color) to keep, on top of nrIntensity. nrTonePreservation is 0..1: protects LUMA
; (brightness/detail) specifically, independent of chroma - 1 leaves luma untouched regardless
; of nrIntensity/nrPasses. Chroma noise reads as far uglier than luma noise at the same
; magnitude, so most real denoisers default toward hitting color harder than brightness.
nrColorStrength=1.0
nrTonePreservation=0.0

; nrGrainPreservation is 0..1 (0=off), used by `nr`: re-adds back some of the REAL luma detail
; the filter removed (not synthetic noise, unlike FSR's fsrFilmGrain) - lets NR smooth without
; flattening a deliberately grainy look.
nrGrainPreservation=0.0

; localStructureStrength and localToneStrength are 0..2, used by `localcontrast`. Both boost
; luma detail via an unsharp mask, but against two different blur radii, so they act at
; different, independent scales: localStructureStrength against a small radius (fine
; texture/micro-detail), localToneStrength against a large radius (broad midtone separation -
; the classic "clarity" look). 0 for both reproduces the input unchanged.
localStructureStrength=0.3
localToneStrength=0.3

; fxIndicator (0/1, default 1) draws a small "FX" badge in the top-right corner of the frame
; whenever the effect= pipeline above actually runs - so "the game looks unchanged" is easy to
; tell apart from "the whole pipeline never fired" (bad ini path, DLL not picked up, GL 4.3
; unavailable) without checking the log. Only shown when effect= lists at least one stage; turn
; it off once you've confirmed things are working and don't want it on screen.
fxIndicator=1

; anisotropy is 0..16 (0=off, the default). Independent of the effect= pipeline above - this
; touches the game's OWN world/model textures directly, not the composited frame. id Tech
; 2-era renderers (this engine included) predate anisotropic filtering, so their textures were
; only ever given GL_LINEAR_MIPMAP_NEAREST ("bilinear mip", not true trilinear) and never
; anisotropic filtering at all - the classic "blurry floor a few feet ahead" look. When set,
; this upgrades every texture the GAME ITSELF already marked as mipmapped (2D/UI/HUD/font
; elements are conventionally uploaded WITHOUT mipmapping, specifically so they stay pixel-exact
; - those are left completely untouched) to full trilinear filtering plus this many samples of
; anisotropic filtering, capped at whatever the GPU/driver actually supports. 8 or 16 is a
; reasonable value on anything made in the last decade-plus; there's essentially no reason to
; use less than the hardware maximum since the visual cost of NOT using it (blurry oblique
; surfaces) is much more noticeable than the (negligible, on modern GPUs) performance cost of
; using it.
anisotropy=8

; Independent of the effect= pipeline above: runs the game's own small GL_RGBA/GL_UNSIGNED_BYTE
; textures IN PLACE at load time (same dimensions, no resize) through one of these stages.
; Only uncompressed RGBA uploads are handled (no BC/S3TC decode).
;   none    off (default)
;   sharpen NVIDIA Image Scaling adaptive sharpen, reusing the sharpness value above
;   cas     AMD Contrast Adaptive Sharpening, also reusing sharpness - lighter than `sharpen`,
;           which matters here since this runs on every eligible texture at load time
;   invert  debug/demo - inverts texture colors, so you can see which draws touch which
;           textures
; `fsr`, `nr` and `localcontrast` are deliberately not accepted here - all three are multi-pass
; with their own owned intermediate textures sized to the upload, so they'd reallocate on nearly
; every texture at many different sizes. Use `cas` for sharpening; `nr`/`localcontrast` are
; whole-frame/whole-scene effects anyway, not really about a single asset's own texel data.
;textureEffect=invert
;textureEffect=sharpen
textureEffect=cas
