; effect: the post-process pipeline, as a comma-separated list of stages.
;
;   - A stage runs if and only if it is listed here. Leave it out to turn it off.
;   - Stages run in the order they are listed, left to right, so reordering this line
;     reorders the pipeline. `effect=bloom, acestonemap` and `effect=acestonemap, bloom`
;     are both valid and produce different images.
;   - Names are case-insensitive, and surrounding spaces are ignored.
;   - `effect=none` (or an empty list) disables post-processing entirely.
;
; Available stages:
;   invert              debug/demo - inverts the image
;   bilinear            bilinear resample (see `scale`)
;   nvscaler            NVIDIA Image Scaling upscaler (see `scale`, `sharpness`)
;   bloom               glow on bright highlights (see `bloomThreshold`, `bloomIntensity`)
;   acestonemap         ACES filmic tone-mapping curve (see `acesStrength`)
;   lutgrading          3D-LUT color grading from a .cube file (see `lutPath`, `lutStrength`)
;   vignette            darkens the corners (see `vignetteIntensity`, `vignetteRadius`)
;   chromaticaberration lens-style edge fringing (see `chromaticAberrationStrength`)
;   taa                 temporal anti-aliasing (see `taaBlend`, `taaJitter`). Where the frame
;                        supplies depth, both projections and both cameras, it reprojects
;                        history along the camera's own motion and jitters the projection so
;                        successive frames carry new samples; otherwise it falls back to the
;                        motion-vector-free blend (see `shimmerSuppression`). It softens
;                        slightly, so a mild sharpener listed AFTER it - e.g. `taa, cas` -
;                        is the conventional pairing (the opposite of `motionblur`, which a
;                        following sharpener undoes). Put `taa` BEFORE
;                        `bilinear`/`nvscaler`/`fsr`: its reprojected path reads the game's
;                        depth buffer, which exists only at the game's own render resolution,
;                        so listed after one of those while it is doing a REAL upscale
;                        (windowWidth/windowHeight larger than the game's own mode) only the
;                        motion-vector-free fallback runs, and says so in the log. It is the
;                        one depth stage that degrades instead of being skipped outright -
;                        see the same rule under `ssr` below for the others.
;                        COST: `taa` also takes a full-resolution copy of the back buffer
;                        every frame, before the HUD is drawn, into a permanently allocated
;                        full-res RGBA16F texture - that is how the reprojected path knows
;                        which pixels are overlay and must be left alone. `motionblur` needs
;                        the same capture and the two SHARE it, so listing both costs no more
;                        than listing either one
;   smaa                spatial anti-aliasing (SMAA) - no ghosting, but no reprojection either;
;                        see the project README for how it compares to `taa`
;   fsr                 AMD FidelityFX Super Resolution 1 - EASU edge-adaptive reconstruction
;                        plus RCAS sharpening (see `scale`, `sharpness`, `fsrDenoise`,
;                        `fsrFilmGrain`)
;   cas                 AMD FidelityFX Contrast Adaptive Sharpening - the lightest of the three
;                        sharpeners here, sharpen-only, never resizes (see `sharpness`)
;   sharpen             NVIDIA Image Scaling adaptive sharpen (see `sharpness`)
;   nr                  edge-aware (bilateral) noise reduction - smooths sampling/shader noise
;                        without a blanket blur (see `nrIntensity`, `nrPasses`,
;                        `nrColorStrength`, `nrTonePreservation`, `nrGrainPreservation`)
;   localcontrast       local tone/structure boost ("clarity"/"texture") at two blur radii (see
;                        `localStructureStrength`, `localToneStrength`)
;   gamma               gamma / brightness correction - the "everything is too dark on my
;                        monitor" control (see `gamma`, `brightness`). A real gamma curve, not
;                        an additive lift: `brightness` is a linear gain applied BEFORE the
;                        exponent, so black stays black at every setting instead of being raised
;                        off the floor into washed-out grey. Belongs late - after grading, just
;                        before `dither`.
;   dither              ordered dither, masks 8-bit banding (see `ditherStrength`)
;   ssao                screen-space ambient occlusion - darkens creases, corners and contact
;                        points using the game's own depth buffer (see `ssaoRadius`,
;                        `ssaoIntensity`, `ssaoBias`). id Tech 2-era renderers bake their lighting
;                        and have no occlusion term at all, so this is what makes objects look
;                        seated in the world instead of pasted onto it. Needs the game's depth
;                        buffer AND its projection (read from the game's own glFrustum call);
;                        no-ops rather than guessing if either is missing.
;   dof                 depth of field - blurs whatever is not at the focus distance, using the
;                        game's own depth buffer (see `dofFocusDistance`, `dofFocusRange`,
;                        `dofBlurStrength`). Like `ssao` it needs the depth buffer AND the
;                        projection, and no-ops rather than guessing if either is missing.
;   fog                 per-pixel distance fog - fades distance toward a COLOUR using the
;                        game's own depth buffer (see `fogStart`, `fogEnd`, `fogIntensity`,
;                        `fogColorR/G/B`). Not the same as `depthvignette`, which fades toward
;                        BLACK: real haze lightens and tints distance rather than darkening it.
;                        id Tech 2-era fog is per-vertex on coarse geometry and bands badly
;                        across big surfaces; this is per pixel. Needs depth AND projection.
;   lightshafts         volumetric light shafts ("god rays") radiating from the brightest
;                        thing in the frame (see `shaftsIntensity`, `shaftsDensity`,
;                        `shaftsDecay`, `shaftsThreshold`). The light's position is FOUND in the
;                        frame - a proxy has no way to be told where it is - so a big pale
;                        surface can pull the rays off the actual lamp; raise `shaftsThreshold`
;                        until only real highlights qualify. Needs neither depth nor projection.
;   ssr                 screen-space reflections - upward-facing surfaces pick up a mirrored
;                        image of what is already on screen above them (see `ssrIntensity`,
;                        `ssrMaxDistance`, `ssrThickness`, `ssrUpThreshold`). A GL 1.1 game has
;                        no material channel, so nothing says WHAT should be shiny; the stand-in
;                        is orientation, and only surfaces facing up reflect. That guess is wrong
;                        both ways - carpet reflects, a wall mirror does not - and it is measured
;                        from the camera's point of view, so pitching up or down swings it off
;                        true. Needs depth AND projection.
;   depthvignette      EXPERIMENTAL/SPIKE - darkens by scene depth (background fades, foreground
;                        stays lit) instead of screen-space corner distance like `vignette` (see
;                        `depthVignetteIntensity`, `depthVignetteThreshold`). Needs the game's own
;                        depth buffer to still be present at swap time; falls back to a no-op if not.
;   motionblur          camera motion blur (see `motionBlurStrength`, `motionBlurMaxRadius`)
;
; Ordering notes, if you're unsure where to put something: tone mapping and grading want to
; run before the "lens" stages (vignette, chromatic aberration) so the LUT grades real scene
; colors rather than colors the lens simulation already darkened. If using `smaa` or `taa`,
; put it before `sharpen` - sharpening after antialiasing recovers detail smoothing softened,
; sharpening before it would just resharpen edges antialiasing then re-smooths. Don't list
; both `smaa` and `taa` together - they solve the same problem, and stacking them is wasted
; work, not better antialiasing. `fsr` reconstructs and sharpens, so it belongs early - before
; the "lens" stages - and listing it together with `sharpen` or `cas` double-sharpens. `nr`
; belongs BEFORE any sharpener (sharpening first would just resharpen the noise `nr` is about to
; remove) and before `localcontrast` too (boosting local contrast in still-noisy source makes
; the noise more visible, not less). Dither is best left last, so it dithers the finished image
; right before it hits the 8-bit back buffer. `gamma` is an output correction too, so it wants
; the same end of the list - after grading, immediately before `dither` - but it is legitimate to
; put it early instead and use `brightness` as an exposure control feeding tone mapping.
;effect=bilinear, bloom, acestonemap, lutgrading, vignette, chromaticaberration, smaa, sharpen, dither
;effect=bilinear, bloom, acestonemap, lutgrading, vignette, chromaticaberration, taa, sharpen, dither
;effect=nr, bilinear, fsr, localcontrast, bloom, acestonemap, lutgrading, vignette, chromaticaberration, taa, dither
;effect=ssao, dof, fog, ssr, bilinear, nvscaler, bloom, acestonemap, lutgrading, vignette, chromaticaberration, taa, dither, gamma
;effect=ssao, ssr, motionblur, bilinear, bloom, acestonemap, lutgrading, vignette, chromaticaberration, taa, dither, gamma
; Upscaling variant of the line below: an upscaler is a hard boundary for the depth stages, so everything that reads depth - ssao, ssr, taa, motionblur - must sit BEFORE it.
;effect=ssao, ssr, taa, motionblur, lightshafts, nvscaler, bloom, acestonemap, lutgrading, vignette, chromaticaberration, dither, gamma
effect=ssao, ssr, taa, motionblur, lightshafts, bloom, acestonemap, lutgrading, vignette, chromaticaberration, dither, gamma

; --- Per-stage parameters. Only read by the stage they belong to, so a parameter for a stage
; --- you haven't listed is simply ignored.

; scale: 0.5..1, used by `bilinear`, `nvscaler` and `fsr`. It is the fraction of the current
; resolution the source is treated as having been rendered at, before the stage reconstructs
; full size - so it trades detail for the look of a lower-resolution render, and the three
; stages are directly comparable at the same value. 1.0 means no resampling at all: bilinear is
; then an exact copy, and fsr shows only its RCAS sharpening. (`sharpen` is sharpen-only and
; always runs 1:1, so it ignores this.) This is a PREVIEW - it downsamples-then-reconstructs a
; frame that was already rendered at full resolution, so it costs GPU time and saves none. To
; make the game actually render smaller and have this upscale that for real (an actual
; performance/quality tradeoff, not just a look), see windowWidth/windowHeight further below -
; scale is ignored in favor of the real ratio whenever that's active.
;if windowWidth=2400 and windowHeight=1800
;scale=0.666666666
scale=1.0

; bloomThreshold is 0..1 (luma level where the glow starts, soft-kneed). bloomIntensity is
; 0..2: 0=no glow added, higher values add a stronger glow.
bloomThreshold=0.8
bloomIntensity=0.5

; acesStrength is 0..1: 0=unchanged, 1=full curve.
acesStrength=0.8

; lutPath is resolved next to this DLL, same as this ini file. lutStrength is 0..1: 0=LUT has
; no effect, 1=full LUT. cyberpunk.cube: teal-tinted shadows, magenta/pink-tinted highlights,
; boosted contrast and saturation - a neon-noir look.
lutPath=cyberpunk.cube
lutStrength=0.3

; vignetteIntensity is 0..1 (0=off, 1=corners fade to black). vignetteRadius is 0..1: where
; the falloff starts as a fraction of the center-to-corner distance - everything closer to the
; center than this is left untouched, so a high radius means a tight corners-only vignette.
vignetteIntensity=0.25
vignetteRadius=0.7

; ssaoRadius is in the GAME'S OWN WORLD UNITS, not a 0..1 fraction like nearly everything else
; here - Quake II units are roughly an inch, so useful values are tens of units, and this is the
; one SSAO setting that genuinely needs tuning per game. Too small and occlusion hugs the
; geometry invisibly; too large and every surface shades every other one into mush.
; ssaoIntensity is 0..1: how dark fully-occluded pixels get (0 = exact no-op).
; ssaoBias is a small view-space epsilon (0..16) that stops a flat surface occluding itself
; through depth-precision noise - raise it if flat walls look dirty/banded, lower it if contact
; shadows have gone missing. Put `ssao` EARLY in the effect= list, before tone mapping and
; grading: it is a lighting term, so it should be applied to scene colors and then graded, not
; painted over a finished grade.
ssaoRadius=24.0
ssaoIntensity=0.5
ssaoBias=0.5

; dofFocusDistance and dofFocusRange are in the GAME'S OWN WORLD UNITS, the same scale as
; ssaoRadius above - raw depth numbers are meaningless on their own, so `dof` converts them with
; the game's own projection. dofFocusDistance=0 means AUTO: focus on whatever the depth buffer
; holds at the centre of the screen, which is usually what you want, since it follows the player
; rather than staying fixed on the distance one room happened to need.
; dofFocusRange is the width of the fully sharp band around the focus distance, and also the
; distance over which the blur ramps to full beyond it - so a small range is a shallow,
; cinematic focus and a large one keeps most of the scene sharp.
; dofBlurStrength is 0..1 and scales the maximum blur radius; 0 is an exact no-op, which is the
; default because depth of field is a strong stylistic choice, not a correction.
; Put `dof` EARLY in the effect= list, before tone mapping and grading, for the same reason
; `ssao` goes early: blurring a finished grade smears the grade, not the scene.
dofFocusDistance=0.0
dofFocusRange=64.0
dofBlurStrength=0.0

; fogStart/fogEnd are in the GAME'S OWN WORLD UNITS, the same scale as ssaoRadius and dof's
; distances. Nothing at or nearer than fogStart is touched; everything at or beyond fogEnd is
; fully fogged; in between it ramps linearly (the same model as the GL_LINEAR fog these engines
; used, so the numbers behave the way you would expect). Quake II units are roughly an inch, so
; the defaults below are about 17 to 170 feet.
; fogIntensity is 0..1 and scales the whole ramp; 0 is an exact no-op and is the default, since
; fog is a look rather than a correction.
; fogColorR/G/B are 0..1. The default is a desaturated blue-grey, which reads as air. Match it to
; the area you are in - a warm tint for Anachronox's rusty exteriors, cooler for interiors.
; Put `fog` EARLY in the effect= list, before tone mapping and grading: fog is part of the scene,
; so it should be graded with everything else rather than painted over the finished grade.
fogStart=200.0
fogEnd=2000.0
fogIntensity=0.0
fogColorR=0.55
fogColorG=0.62
fogColorB=0.70

; shaftsIntensity is 0..1: how much shaft light is added on top of the scene. 0 is an exact
; no-op and is the default.
; shaftsDensity is 0..1: how far toward the light each pixel marches, as a fraction of its
; distance to it. Low keeps shafts short and tight around the source; high sweeps them across
; the frame. Note a pixel further away than the march reaches picks up nothing at all.
; shaftsDecay is 0..1: how fast each step's contribution falls off, which is what tapers a
; shaft. Values near 1 give long rays; lower values give short stubby ones.
; shaftsThreshold is 0..1: the luma above which a pixel counts as light, both for FINDING the
; source and for what the rays accumulate. This is the setting that matters most - too low and
; a bright wall drags the rays away from the actual lamp.
; Unlike ssao/dof/fog these are screen-space fractions, not world units, because the light is
; located in the frame rather than in the scene.
shaftsIntensity=0.35
shaftsDensity=0.6
shaftsDecay=0.96
shaftsThreshold=0.75

; ssrIntensity is 0..1: how strongly a found reflection is blended over the surface. 0 is an
; exact no-op and is the default.
; ssrMaxDistance is in WORLD UNITS (like ssaoRadius and the dof/fog distances): how far a
; reflection ray may travel before giving up. The step count is fixed at 32, so raising this
; lengthens each step rather than adding steps - more reach, less precision, and a thin object
; can end up straddled and missed.
; ssrThickness is in WORLD UNITS too: how far behind a surface a ray may be and still count as
; having hit it. Too small and reflections come out patchy; too large and rays that slipped past
; a foreground object latch onto the background behind it.
; ssrUpThreshold is 0..1 and is the setting that decides WHAT reflects: the minimum upward tilt
; of a surface. 0 makes everything facing up at all reflective, 1 turns the stage off without
; unlisting it. This exists because the game supplies no material information whatsoever, so
; orientation has to stand in for "is this shiny" - see the note under `ssr` above.
;
; Put `ssr` EARLY in the effect= list, for the same reason as ssao/dof/fog and one more: like
; them it belongs before tone mapping and grading, because a reflection is part of the scene and
; should be graded with it rather than pasted on afterwards. The extra reason is that it reads
; the game's depth buffer, which exists only at the game's own render resolution - so listed
; after `bilinear`/`nvscaler`/`fsr` while those are doing a REAL upscale (windowWidth/
; windowHeight larger than the game's own mode), `ssr` is skipped outright and says so in the
; log. It still runs normally after an upscale stage that is not actually resizing anything,
; which is why a misordered list can look fine for a long time.
;
; ssrWorldUpAxis is x, y or z: which axis points up in your game's world. "Upward tilt" above is
; measured against it, which is what keeps the gate steady as you look up and down - before the
; proxy could reconstruct the camera, "up" meant up from the camera's point of view and pitching
; swung the gate off true.
;
; This is an engine fact, not a taste setting: a view matrix says where the camera is and which
; way it faces, never which way is up in the world. Quake II-family engines - Anachronox included
; - use z, which is the default. Many others use y. The symptom of getting it wrong is
; unmistakable rather than subtle: reflections turn up on walls instead of floors. A game whose
; view matrix is never captured at all keeps the old camera-relative behaviour rather than losing
; its reflections, so this setting simply has no effect there.
ssrIntensity=0.3
ssrMaxDistance=512.0
ssrThickness=16.0
ssrUpThreshold=0.7
ssrWorldUpAxis=z

; motionBlurStrength is 0..4: a multiplier on the measured screen-space velocity between this
; frame's camera and the previous one. 0 is an exact no-op.
;
; The 0..4 range is wider than every other intensity here on purpose. 1.0 means "smear over
; exactly one frame of camera motion", and at 60fps that is about 16ms - film looks blurry at
; 24fps, so one frame at 60fps is genuinely a small smear that reads as a shimmer rather than as
; motion blur. Values above 1 are what actually look like the effect; 1.5 is the default and
; 2-3 is a heavy cinematic look. Raising it lengthens the smear for turning and for movement
; alike.
; motionBlurMaxRadius is 0..0.5, a FRACTION OF THE SCREEN, not a world unit like ssaoRadius or
; the dof/fog/ssr distances above - it caps the longest smear allowed. That cap exists because a
; scene cut or a teleport produces an enormous inter-frame camera delta that would otherwise
; smear the whole frame; clamping it is cheaper and more predictable than trying to detect a cut.
;
; This is CAMERA motion only, permanently: the proxy sees fixed-function geometry, not
; per-object transforms, so an NPC walking across an otherwise still frame will not smear -
; there is nowhere in the interception surface an object's own velocity could be read from.
;
; Like ssao/dof/fog/ssr it reads the game's depth buffer (to reproject each pixel from this
; frame's camera into the previous one) as well as the projection and both cameras, so put
; `motionblur` EARLY in the effect= list, BEFORE `bilinear`/`nvscaler`/`fsr` - depth only exists
; at the game's own native render resolution, so listed after a real upscale it can only no-op
; (logged once, same as the other depth-era stages).
;
; ONE MORE ORDERING RULE, and this one is silent: do NOT list a sharpener AFTER `motionblur`.
; `nvscaler`, `cas` and `sharpen` amplify local contrast, which is exactly what a blur removes,
; so `..., motionblur, nvscaler, ...` comes out visibly weaker than the same list without the
; sharpener. Nothing warns about it, because both stages are doing precisely what they are told.
; Put sharpeners before `motionblur`, or drop them while you tune it.
;
; What you should expect to see, so a correct result is not mistaken for a broken one: turning
; smears the whole frame, strafing past nearby geometry smears strongly, strafing across open
; space smears weakly, and walking straight forward barely smears at all near the centre of the
; screen. That last one is real parallax, not a fault - when you walk toward something, the point
; you are looking at hardly moves on screen.
motionBlurStrength=1.5
motionBlurMaxRadius=0.05

; EXPERIMENTAL/SPIKE - depthVignetteIntensity is 0..1 (0=off, 1=most distant pixels fade to
; black), used by `depthvignette`. depthVignetteThreshold is 0..1: the raw (non-linear) scene
; depth below which a pixel is left untouched - everything nearer stays exactly as rendered, and
; the falloff ramps smoothly from there out to the far plane. Try this instead of `vignette` to
; compare a depth-based fade against the usual screen-corner one.
depthVignetteIntensity=0.5
depthVignetteThreshold=0.3

; chromaticAberrationStrength is 0..1; ~0.2-0.4 reads as a subtle lens artifact, 1.0 is
; deliberately overdone.
chromaticAberrationStrength=0.3

; taaBlend is 0..1, the history blend amount: 0=no temporal blend, 1=heaviest. On the
; reprojected path it is the blend weight directly, and what bounds ghosting there is the
; variance clip plus the reprojection itself, not the weight. On the motion-vector-free
; fallback it is a ceiling rather than a fixed weight: that path automatically cuts a pixel's
; effective blend the larger its raw (pre-clamp) difference from history is, so a pixel whose
; content just changed (a fast scene change, a hard cut) converges to the new frame in about
; one call rather than fading in over several.
taaBlend=0.85

; shimmerSuppression is 0..1 (0=off), used by `taa` ONLY on frames where the reprojected path
; is unavailable - it approximates, without motion vectors, what reprojection does properly, so
; the reprojected path ignores it entirely. On the fallback path: taaBlend alone still leaves a
; fixed floor of quiet frame-to-frame flicker (dithered/noisy specular highlights, foliage, fine
; detail near the shading noise floor). This raises the EFFECTIVE blend weight specifically where
; the current frame and history already nearly agree - i.e. nothing is actually moving there - so
; it can't add extra ghosting to real motion or edges the way raising taaBlend itself would.
shimmerSuppression=0.0

; taaJitter is true/false (default true), used by `taa`. Sub-pixel jitter is what lets TAA
; accumulate genuinely new samples instead of averaging one sample with itself - without it
; `taa` only stabilises flicker and leaves edges exactly as aliased as it found them. It is the
; one setting in this file that changes what the GAME renders rather than what happens to the
; finished frame: it shifts the projection by a fraction of a pixel each frame. Turn it off to
; keep reprojection but leave the game's projection untouched.
taaJitter=true

; sharpness is 0..1, used by sharpen/nvscaler/fsr/cas. For `fsr` it sets RCAS's attenuation
; and for `cas` the peak term, 1 being sharpest in both.
sharpness=0.75

; fsrDenoise (0/1, default 0) enables FSR's optional noise-detection path: RCAS sharpens less
; where a pixel looks like isolated noise rather than a real edge. Worth turning on for grainy
; or dithered source material, at the cost of a little sharpness on genuinely detailed input.
fsrDenoise=1

; fsrFilmGrain is 0..1 (0=off): re-applies film grain AFTER reconstruction, weighted so it
; fades out in blacks and highlights. FSR's own guidance is that grain added before upscaling
; gets resampled into mush, so this is where to add it if you want that look.
fsrFilmGrain=0.05

; ditherStrength is 0..1: 0=unchanged, 1=full +-0.5-LSB dither offset.
ditherStrength=0.7

; gamma is 0.5..3.0, the display exponent: 1.0 is an exact no-op, above 1.0 brightens the
; midtones, below 1.0 darkens them. 2.2 is the classic "my monitor is not what this art was
; authored on" correction. The low end stops at 0.5 rather than 0 because the shader divides by
; this value, and 0 would put infinities across the whole frame.
; brightness is 0..2, a linear gain applied BEFORE the exponent (so it scales scene values, not
; already-encoded ones). 1.0 is a no-op; 0 is black. Both at 1.0 reproduce the input exactly, so
; listing `gamma` in effect= and leaving these alone costs a dispatch and changes nothing.
; Note these act on the composited FRAME, unlike the game's own brightness/gamma cvars, which
; usually rebuild palettes or lightmaps - so this works on content those never touched.
gamma=0.70
brightness=1.0

; nrIntensity is 0..1, used by `nr`: how large a luma difference the bilateral filter still
; treats as "the same surface" (its range sigma). 0 makes every pass an effective no-op; 1 is
; the most aggressive. nrPasses is 1..4: how many times the filter runs in sequence - more
; passes compounds the smoothing independently of nrIntensity (which controls each individual
; pass's strength).
nrIntensity=0.5
nrPasses=1

; nrColorStrength is 0..1, used by `nr`: a multiplier on how much of the filtered CHROMA
; (color) to keep, on top of nrIntensity. nrTonePreservation is 0..1: protects LUMA
; (brightness/detail) specifically, independent of chroma - 1 leaves luma untouched regardless
; of nrIntensity/nrPasses. Chroma noise reads as far uglier than luma noise at the same
; magnitude, so most real denoisers default toward hitting color harder than brightness.
nrColorStrength=1.0
nrTonePreservation=0.0

; nrGrainPreservation is 0..1 (0=off), used by `nr`: re-adds back some of the REAL luma detail
; the filter removed (not synthetic noise, unlike FSR's fsrFilmGrain) - lets NR smooth without
; flattening a deliberately grainy look.
nrGrainPreservation=0.0

; localStructureStrength and localToneStrength are 0..2, used by `localcontrast`. Both boost
; luma detail via an unsharp mask, but against two different blur radii, so they act at
; different, independent scales: localStructureStrength against a small radius (fine
; texture/micro-detail), localToneStrength against a large radius (broad midtone separation -
; the classic "clarity" look). 0 for both reproduces the input unchanged.
localStructureStrength=0.3
localToneStrength=0.3

; fxIndicator (0/1, default 1) draws a small "FX" badge in the top-right corner of the frame
; whenever the effect= pipeline above actually runs - so "the game looks unchanged" is easy to
; tell apart from "the whole pipeline never fired" (bad ini path, DLL not picked up, GL 4.3
; unavailable) without checking the log. Only shown when effect= lists at least one stage; turn
; it off once you've confirmed things are working and don't want it on screen.
fxIndicator=1

; anisotropy is 0..16 (0=off, the default). Independent of the effect= pipeline above - this
; touches the game's OWN world/model textures directly, not the composited frame. id Tech
; 2-era renderers (this engine included) predate anisotropic filtering, so their textures were
; only ever given GL_LINEAR_MIPMAP_NEAREST ("bilinear mip", not true trilinear) and never
; anisotropic filtering at all - the classic "blurry floor a few feet ahead" look. When set,
; this upgrades every texture the GAME ITSELF already marked as mipmapped (2D/UI/HUD/font
; elements are conventionally uploaded WITHOUT mipmapping, specifically so they stay pixel-exact
; - those are left completely untouched) to full trilinear filtering plus this many samples of
; anisotropic filtering, capped at whatever the GPU/driver actually supports. 8 or 16 is a
; reasonable value on anything made in the last decade-plus; there's essentially no reason to
; use less than the hardware maximum since the visual cost of NOT using it (blurry oblique
; surfaces) is much more noticeable than the (negligible, on modern GPUs) performance cost of
; using it.
anisotropy=8

; autoMipmap is 0/1 (0=off, the default). The other half of the picture from anisotropy above:
; that setting only reaches textures the GAME ITSELF mipmapped, and a texture uploaded without
; a mip chain still shimmers at distance no matter how it is filtered, because there is nothing
; below level 0 to sample. This generates that missing chain.
;
; The hazard is that "uploaded without a mip chain" is also exactly how 2D/UI/HUD/font artwork
; is uploaded, and mipping those blurs the pixel-exact elements anisotropy is careful to leave
; alone. So this does NOT act on uploads. It waits until a texture is actually DRAWN while the
; 3D projection is in force, and only generates for those - a texture that only ever appears
; under the 2D projection is never touched. A census of this engine found 12 of the 49 textures
; drawn in the world pass had no mip chain, so the target set is real but small; expect a subtle
; reduction in distant shimmer on those surfaces rather than a dramatic change.
;
; Cost: one glGenerateMipmap per affected texture, the first time it becomes visible, which can
; show up as a one-frame pop. If a sprite or alpha-tested decal thins out at distance with this
; on, that is the known failure mode - turn it back off.
autoMipmap=0

; windowWidth/windowHeight: force the game's window to this CLIENT size at the moment it creates
; its GL context (see window_override.h) - independent of the effect= pipeline above, since this
; is a Win32 window property, not a rendered stage. Both default to 0, meaning "leave the game's
; own window size alone"; the override only applies when BOTH are set to a positive value - id
; Tech 2-era engines pick their own window size from their own video-mode cvars, so this is how
; to force a size (e.g. a wider resolution than the game's menu offers) without touching those.
;windowWidth=2400
;windowHeight=1800
;
; Combined with a game running at a LOWER resolution than this (set the game's own video mode,
; e.g. Anachronox's 400x300 preset, separately in-game), this is what makes `bilinear`/`nvscaler`/
; `fsr` above into a REAL upscale: the game renders small, this window stays big, and
; post_effects.cpp detects the mismatch and reconstructs the small frame up to fill it - not the
; same-size "preview a lower-res look" trick `scale` does on its own when the game and window
; already match. No extra key needed for this - it's automatic once the window is bigger than
; what the game itself renders, and it fills the window even with effect=none (just stretched,
; with no reconstruction quality to speak of - list an upscale stage above for a real one). Keep
; windowWidth/windowHeight at the same aspect ratio as the game's own resolution (e.g. exactly
; double it, as 800x600 is to 400x300) or the image comes out stretched on one axis. Depth-based
; stages (`ssao`, `depthvignette`) only work at the game's native resolution, so list them BEFORE
; the upscale stage in effect= when using this - listed after, they can only no-op (logged once).

; renderWidth/renderHeight: render the game into an offscreen buffer of this size and downsample
; it to the window on present - true supersampling. Both default to 0, meaning off; like
; windowWidth/windowHeight, the override only applies when BOTH are positive.
;
; This is the one thing windowWidth/windowHeight cannot do. That setting makes the WINDOW bigger,
; which makes the game's own image get stretched across it; this makes the game's image be made
; of more samples in the first place, and the downsample on present is what turns those extra
; samples into antialiasing.
;
; Set this ABOVE the resolution the game itself renders at (its own video mode), not above your
; monitor - a value below the game's own viewport is refused, since rendering smaller is a
; different feature wearing this one's name. 2x on each axis means every stage in the effect=
; chain does 4x the work, which is the real cost here; the memory is unremarkable.
;
; Supersampling supersedes the upscalers: with it active, fsr/nvscaler/bilinear in effect= have
; nothing left to upscale and fall back to their same-size behaviour.
renderWidth=0
renderHeight=0

; renderFloatBuffer is 0/1 (0=off, the default). Makes that offscreen buffer RGBA16F instead of
; RGBA8, so the game's OWN blending accumulates at 16-bit float rather than 8-bit - the same
; banding fix a deeper back buffer would give, without touching pixel formats. Off by default
; because it genuinely changes how the game's blending accumulates: supersampling on its own
; should change nothing but sample count.
renderFloatBuffer=0

; Independent of the effect= pipeline above: runs the game's own small GL_RGBA/GL_UNSIGNED_BYTE
; textures IN PLACE at load time (same dimensions, no resize) through one of these stages.
; Only uncompressed RGBA uploads are handled (no BC/S3TC decode).
;   none    off (default)
;   sharpen NVIDIA Image Scaling adaptive sharpen, reusing the sharpness value above
;   cas     AMD Contrast Adaptive Sharpening, also reusing sharpness - lighter than `sharpen`,
;           which matters here since this runs on every eligible texture at load time
;   invert  debug/demo - inverts texture colors, so you can see which draws touch which
;           textures
; `fsr`, `nr` and `localcontrast` are deliberately not accepted here - all three are multi-pass
; with their own owned intermediate textures sized to the upload, so they'd reallocate on nearly
; every texture at many different sizes. Use `cas` for sharpening; `nr`/`localcontrast` are
; whole-frame/whole-scene effects anyway, not really about a single asset's own texel data.
;textureEffect=invert
;textureEffect=sharpen
textureEffect=cas

; frameDumpKey: press this key in-game to write the current frame - color, depth AND the
; projection - to frameDumpPath, for the standalone config editor to load and tune against. It
; is a Windows virtual-key code, so hex is the readable way to write it (0x7A = F11, 0x2D =
; Insert, 0x24 = Home); 0 disables the feature and its per-frame key check with it.
;
; Why bother: the config editor can show you a synthetic test room, but the settings that are
; hardest to get right are exactly the ones a synthetic scene can't model honestly - ssaoRadius
; is in the game's own world units, and bloomThreshold depends on the real brightness of the
; game's art. Dump a frame from somewhere representative, load it in the editor, and you are
; tuning against the real thing instead of a stand-in.
;
; The dump captures the frame BEFORE any stage runs, so it works even with effect=none and
; always gives the editor unprocessed source to apply effects to. The file is written relative
; to the game's working directory (normally next to its .exe), and is overwritten each time.
; These files are uncompressed - roughly width*height*8 bytes, so ~16 MB at 1440x900.
; 0x7B = F12
frameDumpKey=0x7B
frameDumpPath=opengl32_enhancer_frame.dump

; cameraLogInterval: prints the camera position and orientation this DLL reconstructs from the
; game's matrix calls to opengl32_enhancer.log, every N frames. 0 (the default) is off.
;
; This is a diagnostic, not an effect - nothing renders differently with it on. It exists
; because working out which matrix is the camera's is a heuristic about how the engine draws,
; and the only way to confirm it holds for YOUR game is to watch the numbers while you move.
; Walk a straight line: the position should slide steadily. Turn on the spot: the forward and
; up vectors should swing while the position stays put. If the numbers jump around while you
; stand still, the capture is picking up something that is not the camera - say so in a bug
; report, with the game's name.
;
; 60 is about once a second; lower values write a lot of lines.
cameraLogInterval=0
